version: 2

models:
  - name: dim_customer_360
    columns:
      - name: customer_sk
        tests: [unique, not_null]

  - name: fact_rfm
    columns:
      - name: customer_sk
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
      - name: rfm_segment
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'Champions'
                  - 'Loyal Customers'
                  - 'Cannot Lose Them'
                  - 'Potential Loyalists'
                  - 'New Customers'
                  - 'Promising'
                  - 'Need Attention'
                  - 'At Risk'
                  - 'About To Sleep'
                  - 'Hibernating'
                  - 'Lost'

  - name: fact_manager_performance
    columns:
      - name: manager_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_manager')
                field: manager_id
