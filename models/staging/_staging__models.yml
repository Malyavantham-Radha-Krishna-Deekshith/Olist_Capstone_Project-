version: 2

models:
  - name: stg_olist__customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]

  - name: stg_olist__orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'invoiced', 'processing', 'unavailable', 'created', 'approved']

  - name: stg_olist__order_items
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]

  - name: stg_olist__payments
    columns:
      - name: order_id
        tests: [not_null]

  - name: stg_olist__products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_olist__reviews
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
              config:
                where: "review_score is not null"

  - name: stg_olist__geolocation
    columns:
      - name: geolocation_zip_code_prefix
        tests: [not_null]

  - name: stg_olist__category_translation
    columns:
      - name: product_category_name
        tests: [unique, not_null]
